name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational only: tsc --noEmit was never enforced as a gate in this repo
      # before this workflow existed (vite build transpiles via esbuild/SWC and
      # never validated types). Running it for the first time surfaces ~300
      # pre-existing errors across most of the codebase -- almost entirely caused
      # by src/integrations/supabase/types.ts (generated) being stale relative to
      # tables/RPCs the app already queries (recipes, cash_turns, roles,
      # notifications, has_role-only RPC typing, etc.), plus missing bun:test
      # types on every *.test.ts file. None of that is something a single push
      # should be blocked on; fixing it for real means regenerating types.ts and
      # touching ~80 files, which is its own separate, explicitly-scoped task.
      - name: Typecheck (informational)
        run: npx tsc --noEmit -p tsconfig.app.json
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Test
        run: bun test

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
